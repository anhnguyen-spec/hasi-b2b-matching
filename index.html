    const roles = R.map((r) => ({ label: r[1], sel: st.role === r[0] ? 'true' : 'false', pick: () => this.setState({ role: r[0] }), style: 'padding: 11px 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 44px; ' + (st.role === r[0] ? 'background: #0A2C74; color: #FFFFFF; border: 1.5px solid #0A2C74' : 'background: #FFFFFF; color: #0A2C74; border: 1.5px solid #C5D8EC') }));
    const v = st.f;
    const errs = {
      name: v.name.trim() ? '' : L('Vui lòng nhập họ tên.', 'Please enter your full name.'),
      company: v.company.trim() ? '' : L('Vui lòng nhập tên doanh nghiệp.', 'Please enter your company name.'),
      title: v.title.trim() ? '' : L('Vui lòng nhập chức vụ.', 'Please enter your job title.'),
      email: /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email) ? '' : L('Email chưa hợp lệ.', 'Please enter a valid email.'),
      phone: /^\+?[0-9][0-9\s().-]{6,18}$/.test(v.phone.trim()) ? '' : L('Số điện thoại chưa hợp lệ (có thể kèm mã quốc gia, VD: +81...).', 'Please enter a valid phone number, with country code (e.g. +81...).'),
      country: v.country.trim() ? '' : L('Vui lòng nhập quốc gia.', 'Please enter your country.'),
      website: ''
    };
    const F = en
      ? [['name', 'Full name *', 'text', 'John Smith'], ['company', 'Company *', 'text', 'Company name'], ['title', 'Job title *', 'text', 'Procurement Manager'], ['email', 'Email *', 'email', 'name@company.com'], ['phone', 'Phone (with country code) *', 'tel', '+84 9xx xxx xxx'], ['country', 'Country *', 'text', 'Japan'], ['website', 'Company website', 'url', 'https://company.com']]
      : [['name', 'Họ và tên *', 'text', 'Nguyễn Văn A'], ['company', 'Doanh nghiệp *', 'text', 'Tên công ty'], ['title', 'Chức vụ *', 'text', 'Trưởng phòng Thu mua'], ['email', 'Email *', 'email', 'ten@congty.com'], ['phone', 'Số điện thoại (kèm mã quốc gia) *', 'tel', '+84 9xx xxx xxx'], ['country', 'Quốc gia *', 'text', 'Việt Nam'], ['website', 'Website doanh nghiệp', 'url', 'https://congty.com']];
    const fields = F.map((x) => {
      const err = st.tried ? errs[x[0]] : '';
      return { label: x[1], type: x[2], ph: x[3], value: v[x[0]], err, bad: err ? 'true' : 'false',
        on: (ev) => this.setState({ f: Object.assign({}, this.state.f, { [x[0]]: ev.target.value }) }),
        style: 'padding: 13px 14px; border-radius: 12px; font: inherit; font-size: 15px; min-height: 22px; border: 1.5px solid ' + (err ? '#D92D20' : '#C5D8EC') };
    });
    const ok = !Object.values(errs).some(Boolean) && st.agree;
    const pill = (on) => 'border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; min-height: 32px; min-width: 44px; ' + (on ? 'background: #0A2C74; color: #FFFFFF' : 'background: transparent; color: #0A2C74');
    const faq = en ? [
      { q: 'What is B2S 2026?', a: 'B2S 2026 connects Buyers - lead firms and FDI enterprises - with Vietnamese suppliers. It is part of the Supply - Demand Connection Conference coordinated by the HCMC Department of Industry and Trade, ITPC and HASI.' },
      { q: 'Do Buyers need to register an account themselves?', a: 'No. The Organising Committee creates your Buyer account. Sign in with your email or phone number, add team members and complete your company profile.' },
      { q: 'What should I prepare before posting a sourcing request?', a: '• Company details: tax code, business line, address, phone, email, website\n• Email/phone of team members (Procurement, Engineering)\n• Sectors and sourcing description (up to 500 characters: product, volume, standards, location)\n• Parts list: name, application, quantity, material, standards, up to 3 images per item\n• Country/region and estimated budget (optional)' },
      { q: 'Where is my sourcing request displayed?', a: 'Under Sourcing requests on the event page and in the HASI HUB Marketplace, so relevant suppliers can find it and request a meeting.' },
      { q: 'Do I have to meet every supplier who sends a request?', a: 'No. Each request arrives by email with the supplier’s capability profile; you decide to accept or decline. Only approved suppliers are scheduled.' },
      { q: 'When will I receive my B2B meeting schedule?', a: 'Schedules are set 2 days before the event and emailed to both Buyers and suppliers.' },
      { q: 'Is support available in English?', a: 'Yes. Contact the Organising Committee at hasi@hasi.org.vn or +84 81 522 1322 and state your preferred language when registering.' },
      { q: 'What is the registration deadline?', a: 'Before 7 December 2026. Posting early gives you more time to receive and review meeting requests.' }
    ] : [
      { q: 'B2S 2026 là gì?', a: 'B2S 2026 là chương trình kết nối Buyer - doanh nghiệp dẫn dắt chuỗi, doanh nghiệp FDI - với nhà cung ứng Việt Nam, thuộc Hội nghị Kết nối Cung - Cầu do Sở Công Thương TP.HCM, ITPC và HASI chủ trì điều phối.' },
      { q: 'Buyer có cần tự đăng ký tài khoản?', a: 'Không. Ban Tổ chức khởi tạo tài khoản Buyer. Quý doanh nghiệp đăng nhập bằng email/số điện thoại, bổ sung tài khoản thành viên và hoàn thiện hồ sơ doanh nghiệp.' },
      { q: 'Cần chuẩn bị gì trước khi đăng tải nhu cầu thu mua?', a: '• Thông tin doanh nghiệp: mã số thuế, ngành nghề, địa chỉ, điện thoại, email, website\n• Email/SĐT của thành viên phụ trách (Thu mua, Kỹ thuật)\n• Lĩnh vực quan tâm và mô tả nhu cầu (tối đa 500 ký tự: sản phẩm, sản lượng, tiêu chuẩn, khu vực)\n• Danh mục linh kiện: tên, mục đích, số lượng, vật liệu, tiêu chuẩn, tối đa 3 ảnh mỗi hạng mục\n• Quốc gia/khu vực và ngân sách dự kiến (tùy chọn)' },
      { q: 'Nhu cầu thu mua được hiển thị ở đâu?', a: 'Tại mục Nhu cầu thu mua trong trang sự kiện và mục Giao thương trên HASI HUB, giúp nhà cung ứng phù hợp tiếp cận và gửi yêu cầu gặp gỡ.' },
      { q: 'Buyer có bắt buộc gặp mọi nhà cung ứng gửi yêu cầu?', a: 'Không. Mỗi yêu cầu được gửi qua email kèm hồ sơ năng lực; Buyer toàn quyền chấp nhận hoặc từ chối. Hệ thống chỉ xếp lịch với nhà cung ứng đã được phê duyệt.' },
      { q: 'Khi nào Buyer nhận được lịch gặp gỡ B2B?', a: 'Lịch làm việc được sắp xếp trước sự kiện 2 ngày và gửi qua email cho cả Buyer và nhà cung ứng.' },
      { q: 'Có hỗ trợ bằng tiếng Anh không?', a: 'Có. Vui lòng liên hệ Ban Tổ chức qua hasi@hasi.org.vn hoặc +84 81 522 1322 và chọn ngôn ngữ trao đổi khi đăng ký.' },
      { q: 'Hạn chót đăng ký là khi nào?', a: 'Trước ngày 07/12/2026. Đăng tải nhu cầu sớm giúp Buyer có thêm thời gian tiếp nhận và thẩm định các yêu cầu gặp gỡ.' }
    ];
    return {
      isVi: !en, isEn: en, isViStr: en ? 'false' : 'true', isEnStr: en ? 'true' : 'false',
      langLabel: L('Ngôn ngữ', 'Language'), viStyle: pill(!en), enStyle: pill(en),
      toVi: () => this.setState({ lang: 'vi', sector: 0, pref: 0 }), toEn: () => this.setState({ lang: 'en', sector: 0, pref: 0 }),
      regOpen: !!st.reg, openReg: () => this.setState({ reg: true }), closeReg: () => this.setState({ reg: false }),
      cd, stats, sectors, kTabs, kGroups, kSel, kListHead, kHint, prefs, timeline, chips, scr, day2, roles, fields, faq,
      kImg: su.kind === 'img', kMail1: su.kind === 'mail1', kTeam: su.kind === 'team', kMail4: su.kind === 'mail4', kApp: su.kind === 'app',
      isFirst: pos === 0, isLast: pos === flat.length - 1,
      prev: () => this.setState({ g: Math.max(0, pos - 1) }), next: () => this.setState({ g: Math.min(flat.length - 1, pos + 1) }),
      guideOpen: st.guide, guideOpenStr: st.guide ? 'true' : 'false',
      guideBtn: st.guide ? L('Thu gọn hướng dẫn', 'Hide the guide') : L('Xem hướng dẫn chi tiết', 'View the step-by-step guide'),
      toggleGuide: () => this.setState({ guide: !st.guide }),
      sector: sectors[st.sector] || sectors[0], onSector: (ev) => this.setState({ sector: Math.max(0, sectors.indexOf(ev.target.value)) }),
      pref: prefs[st.pref] || prefs[0], onPref: (ev) => this.setState({ pref: Math.max(0, prefs.indexOf(ev.target.value)) }),
      agree: st.agree, onAgree: (ev) => this.setState({ agree: ev.target.checked }),
      agreeErr: st.tried && !st.agree,
      submit: () => ok ? this.setState({ sent: true }) : this.setState({ tried: true }),
      reset: () => this.setState({ sent: false, tried: false, agree: false, f: { name: '', company: '', title: '', email: '', phone: '', country: '', website: '' } }),
      formOpen: !st.sent, sent: st.sent,
      firstName: (v.name.trim().split(/\s+/)[en ? 0 : v.name.trim().split(/\s+/).length - 1] || L('Quý vị', 'you')),
      roleLabel: (R.find((r) => r[0] === st.role) || R[0])[1]
    };
  }
}

window.__mount(Component);
</script>
